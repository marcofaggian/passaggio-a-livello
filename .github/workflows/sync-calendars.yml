name: Sync Passaggi a Livello iCal

on:
  schedule:
    # Esegue ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla tab Actions

permissions:
  contents: write # Necessario per fare push dei file .ics aggiornati

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.27.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Restore Delta-Polling State Cache
        uses: actions/cache@v4
        with:
          path: state_cache.json
          key: pl-state-${{ github.run_id }}
          restore-keys: |
            pl-state-

      - name: Run Inference & Calendar Generator
        env:
          REGION_PRESET: "ITALY_ALL"
          OUTPUT_DIR: "calendars"
          STATE_CACHE_PATH: "state_cache.json"
          MIN_SAFE_REOPEN_SEC: "120"
          RATE_LIMIT_RPS: "3.5"
        run: go run main.go

      - name: Commit and Push updated calendars (lazy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendars/
          if ! git diff --staged --quiet; then
            git commit -m "chore(calendars): aggiornamento lazy orari PL [skip ci]"
            git push
          else
            echo "Nessuna variazione rilevata: nessun commit necessario."
          fi
